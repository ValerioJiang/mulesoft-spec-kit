schema_version: "1.0"

extension:
  id: "salesforce"
  name: "Salesforce Technical Solution"
  version: "2.0.2"
  description: "Salesforce design stages for a central Spec Kit workspace: specification, clarification, technical planning with a read-only DX MCP gate, and review, for any Salesforce DX repository."
  author: "MuleSoft Spec Kit"
  repository: "https://github.com/ValerioJiang/mulesoft-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: "speckit.salesforce.specify"
      file: "commands/specify.md"
      description: "Produce Salesforce CRM requirements for the selected initiative using the shared common intent."
    - name: "speckit.salesforce.clarify"
      file: "commands/clarify.md"
      description: "Identify missing Salesforce-specific requirements and org evidence."
    - name: "speckit.salesforce.plan"
      file: "commands/plan.md"
      description: "Draft Salesforce technical and data-model plans in the selected initiative."
    - name: "speckit.salesforce.review"
      file: "commands/review.md"
      description: "Check Salesforce plan traceability and consistency with common integration contracts."

  templates:
    - name: "salesforce-plan-template"
      file: "templates/salesforce-plan-template.md"
      description: "Salesforce technical plan."
    - name: "salesforce-data-model-template"
      file: "templates/salesforce-data-model-template.md"
      description: "Salesforce data model and security constraints."

tags:
  - "salesforce"
  - "crm"
  - "solution-design"
