schema_version: "1.0"

extension:
  id: "mulesoft"
  name: "MuleSoft Technical Solution"
  version: "2.0.1"
  description: "MuleSoft lifecycle stages for a central Spec Kit workspace: requirements, contracts, planning, tasks, implementation, verification, review and release for any Mule 4 repository."
  author: "MuleSoft Spec Kit"
  repository: "https://github.com/ValerioJiang/mulesoft-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: "speckit.mulesoft.specify"
      file: "commands/specify.md"
      description: "Produce MuleSoft requirements for the selected initiative using the shared common intent."
    - name: "speckit.mulesoft.clarify"
      file: "commands/clarify.md"
      description: "Identify MuleSoft contract, app ownership, runtime and live-evidence gaps."
    - name: "speckit.mulesoft.plan"
      file: "commands/plan.md"
      description: "Draft a MuleSoft technical plan for the selected initiative."
    - name: "speckit.mulesoft.review"
      file: "commands/review.md"
      description: "Review MuleSoft app scope, contract provenance and shared integration consistency."
    - name: "speckit.mulesoft.tasks"
      file: "commands/tasks.md"
      description: "Decompose the selected MuleSoft plan into traceable app, contract, test, and release tasks."
    - name: "speckit.mulesoft.analyze"
      file: "commands/analyze.md"
      description: "Check the selected MuleSoft scope, plan and tasks against the configured source repositories."
    - name: "speckit.mulesoft.implement"
      file: "commands/implement.md"
      description: "Implement explicitly selected MuleSoft tasks in the configured application repository."
    - name: "speckit.mulesoft.qa"
      file: "commands/qa.md"
      description: "Execute the MuleSoft verification cases selected in the approved initiative plan."
    - name: "speckit.mulesoft.verify"
      file: "commands/verify.md"
      description: "Summarize MuleSoft implementation evidence against requirements and tasks."
    - name: "speckit.mulesoft.change"
      file: "commands/change.md"
      description: "Assess a requested change against the current MuleSoft initiative baseline."
    - name: "speckit.mulesoft.pr"
      file: "commands/pr.md"
      description: "Review MuleSoft changes and prepare repository-native review evidence."
    - name: "speckit.mulesoft.deploy"
      file: "commands/deploy.md"
      description: "Deploy a MuleSoft application only to an explicitly requested target."
    - name: "speckit.mulesoft.uat"
      file: "commands/uat.md"
      description: "Prepare or record business UAT for a MuleSoft initiative."
    - name: "speckit.mulesoft.release"
      file: "commands/release.md"
      description: "Prepare a MuleSoft release record from approved, observed evidence."

  templates:
    - name: "mulesoft-plan-template"
      file: "templates/mulesoft-plan-template.md"
      description: "MuleSoft technical plan."
    - name: "mulesoft-contract-template"
      file: "templates/mulesoft-contract-template.md"
      description: "API contract draft record (unpublished until approved)."

tags:
  - "mulesoft"
  - "api"
  - "solution-design"
