schema_version: "1.0"

extension:
  id: "mulesoft"
  name: "MuleSoft Technical Solution"
  version: "2.0.0"
  description: "MuleSoft lifecycle stages for a central Spec Kit workspace: requirements, contracts, planning, tasks, implementation, verification, review and release for any Mule 4 repository."
  author: "Spec Kit Workspace"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: "speckit.mulesoft.specify"
      file: "commands/specify.md"
      description: "Create MuleSoft requirements from the common initiative intent."
    - name: "speckit.mulesoft.clarify"
      file: "commands/clarify.md"
      description: "Identify contract, runtime, ownership and evidence gaps."
    - name: "speckit.mulesoft.plan"
      file: "commands/plan.md"
      description: "Draft a MuleSoft technical plan grounded in app and contract evidence."
    - name: "speckit.mulesoft.review"
      file: "commands/review.md"
      description: "Review app scope, contract provenance and consistency with common integration IDs."
    - name: "speckit.mulesoft.tasks"
      file: "commands/tasks.md"
      description: "Create traceable MuleSoft implementation, verification and release tasks."
    - name: "speckit.mulesoft.analyze"
      file: "commands/analyze.md"
      description: "Analyze selected MuleSoft apps and contracts against the initiative scope."
    - name: "speckit.mulesoft.implement"
      file: "commands/implement.md"
      description: "Implement explicitly selected MuleSoft tasks in a configured source repository."
    - name: "speckit.mulesoft.qa"
      file: "commands/qa.md"
      description: "Run planned MuleSoft checks and record results in the central initiative."
    - name: "speckit.mulesoft.verify"
      file: "commands/verify.md"
      description: "Review implementation and verification evidence against initiative requirements."
    - name: "speckit.mulesoft.change"
      file: "commands/change.md"
      description: "Assess a request against the current MuleSoft initiative baseline."
    - name: "speckit.mulesoft.pr"
      file: "commands/pr.md"
      description: "Review MuleSoft changes and prepare repository-native review evidence."
    - name: "speckit.mulesoft.deploy"
      file: "commands/deploy.md"
      description: "Deploy only to an explicitly requested MuleSoft target."
    - name: "speckit.mulesoft.uat"
      file: "commands/uat.md"
      description: "Prepare or record business UAT for MuleSoft requirements."
    - name: "speckit.mulesoft.release"
      file: "commands/release.md"
      description: "Prepare a MuleSoft release record from approved evidence."

  templates:
    - name: "mulesoft-plan-template"
      file: "templates/mulesoft-plan-template.md"
      description: "MuleSoft technical plan."
    - name: "mulesoft-contract-template"
      file: "templates/mulesoft-contract-template.md"
      description: "API contract draft record (unpublished until approved)."

tags:
  - "mulesoft"
  - "api"
  - "solution-design"
