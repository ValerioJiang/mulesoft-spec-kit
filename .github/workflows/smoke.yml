name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  create-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Spec Kit CLI
        run: |
          python -m pip install --quiet uv
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate manifests
        run: |
          python -m pip install --quiet pyyaml
          for f in extensions/*/extension.yml presets/*/preset.yml workflows/*/workflow.yml bundles/*/bundle.yml; do
            python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done
          for f in extensions/catalog.json presets/catalog.json workflows/catalog.json bundles/catalog.json; do
            python -c "import sys, json; json.load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done
      - name: Create a workspace with every component
        run: scripts/bash/create-workspace.sh "$RUNNER_TEMP/ws" --integration claude --script sh --with-sf-workspace
      - name: Check what the CLI generated
        working-directory: ${{ runner.temp }}/ws
        run: |
          test -f .claude/skills/speckit-technical-solution-run/SKILL.md
          test -f .claude/skills/speckit-mulesoft-plan/SKILL.md
          test -f .claude/skills/speckit-salesforce-plan/SKILL.md
          test -f .claude/skills/speckit-sf-workspace-stories/SKILL.md
          test -f .claude/skills/speckit-review/SKILL.md
          ! grep -rnE "(^|[ \`\"'(])(templates|scripts|docs)/" .claude/skills --include=SKILL.md | grep -vE "\.specify/(extensions|scripts|templates|memory)/|metadata|source:"
          specify preset resolve spec-template | grep -q "core"
          specify preset resolve tasks-template | grep -q "central-workspace"
          cp .specify/extensions/technical-solution/workspace/spec-kit-workspace.json .
          cp .specify/extensions/technical-solution/workspace/spec-kit-workspace.local.json.template spec-kit-workspace.local.json
          python3 .specify/extensions/technical-solution/scripts/source_workspaces/cli.py list
      - name: Update mode is idempotent
        run: scripts/bash/create-workspace.sh "$RUNNER_TEMP/ws" --integration claude --script sh --with-sf-workspace --update
