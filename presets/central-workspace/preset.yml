schema_version: "1.0"

preset:
  id: "central-workspace"
  name: "Central Workspace"
  version: "1.1.0"
  description: "Core Spec Kit commands and templates adapted to a central multi-repository workspace where artifacts live under initiatives/<id>/<domain>/."
  author: "MuleSoft Spec Kit"
  repository: "https://github.com/ValerioJiang/mulesoft-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Create or refine traceable initiative requirements in the central Spec Kit workspace."
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Find and record missing initiative decisions without inventing answers."
      replaces: "speckit.clarify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Produce an implementation-ready technical plan under the selected central initiative domain."
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Build a traceable task or story breakdown from an approved initiative plan."
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Analyze selected scope and implementation tasks against application repositories and shared contracts."
      replaces: "speckit.analyze"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement explicitly selected tasks in the application repository for a central initiative."
      replaces: "speckit.implement"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Find remaining implementation gaps and append traceable work without rewriting approved artifacts."
      replaces: "speckit.converge"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Generate a requirements-quality checklist for an initiative scope without judging the implementation."
      replaces: "speckit.checklist"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      description: "Create tracker issues from the tasks of an initiative domain, only on a direct request that names the tracker."
      replaces: "speckit.taskstoissues"
    - type: "command"
      name: "speckit.review"
      file: "commands/speckit.review.md"
      description: "Review initiative artifacts or an application diff against approved scope and evidence."
    - type: "command"
      name: "speckit.verify"
      file: "commands/speckit.verify.md"
      description: "Verify completed implementation against initiative requirements and record exact evidence."
    - type: "command"
      name: "speckit.release"
      file: "commands/speckit.release.md"
      description: "Prepare or execute an explicitly requested release stage using a named target and verified evidence."

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan template with central initiative paths."
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks template with central initiative paths and verification tasks."
      replaces: "tasks-template"
    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Checklist template for requirements-quality reviews of an initiative scope."
      replaces: "checklist-template"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Constitution of a central technical-solution workspace."
      replaces: "constitution-template"

tags:
  - "workspace"
  - "multi-repo"
  - "core"
